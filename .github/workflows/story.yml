name: story

# Told-story Short: OpenAI plans a story in scenes -> the story is narrated (default:
# the owner's cloned voice via styletts2-voice-clone; or an ElevenLabs voice) -> each
# scene gets a Pexels clip chosen by CLIP and cut to its narration -> music bed +
# banner -> OpenAI transcription checks the words.
# Nothing is published; results are uploaded as run artifacts.

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Story idea (empty = the model invents one)
        default: ""
      language:
        description: ta or en
        default: ta
      cat-name:
        description: The hero cat's name
        default: Karees
      seconds:
        description: Target story length in seconds
        default: "45"
      style:
        description: "Voice style in the profile: comedy_v2 (new Tamil comedy ref), comedy or default"
        default: comedy_v2
      voice-engine:
        description: "own = cloned voice (styletts2-voice-clone); elevenlabs = voice from voices/voices.json"
        default: own
      elevenlabs-voice:
        description: Key in voices/voices.json (used when voice-engine = elevenlabs)
        default: karees_mass_hero_ta
      voice-tempo:
        description: "Voice speed, same pitch: 0.9 = 10% slower"
        default: "0.9"
      music-style:
        description: Comedy music bed, bouncy (cartoon oom-pah) or sneaky (tiptoe heist)
        default: sneaky
      banner:
        description: Banner title (empty = the story's own title)
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      text: ${{ steps.text.outputs.text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - name: Plan the story (OpenAI)
        env:
          OPEN_AI_API: ${{ secrets.OPEN_AI_API }}
          THEME: ${{ inputs.theme }}
        run: |
          python pipeline/story_plan.py --theme "$THEME" --lang "${{ inputs.language }}" \
            --name "${{ inputs.cat-name }}" --seconds "${{ inputs.seconds }}" --out story/story.json
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          p = json.load(open("story/story.json", encoding="utf-8"))
          print(f"## Story: {p['title']}\n")
          for i, s in enumerate(p["scenes"], 1):
              print(f"{i}. **[{s['tag']}]** {s['text']}  \n   _clip search: {s['query']}_")
          EOF
      - id: text
        run: |
          {
            echo "text<<STORY_EOF"
            python3 -c "import json;print(' '.join(s['text'].strip() for s in json.load(open('story/story.json',encoding='utf-8'))['scenes']))"
            echo "STORY_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: story-plan
          path: story/story.json
          retention-days: 7

  voice:
    needs: plan
    if: inputs.voice-engine == 'own'
    uses: oceanfarm1992-design/styletts2-voice-clone/.github/workflows/narrate.yml@main
    with:
      text: ${{ needs.plan.outputs.text }}
      language: ${{ inputs.language }}
      style: ${{ inputs.style }}
      artifact-name: voiceover
    secrets:
      VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}

  build:
    needs: [plan, voice]
    # runs after the cloned-voice job, or straight after planning when ElevenLabs is used
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.voice.result == 'success' || needs.voice.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        timeout-minutes: 6   # a stuck apt mirror once took 18 min
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32
      - uses: actions/download-artifact@v4
        with:
          name: story-plan
          path: story
      - uses: actions/download-artifact@v4
        if: inputs.voice-engine == 'own'
        with:
          pattern: voiceover-part_*     # per-sentence WAVs from the cloned-voice engine
          path: own/wavs
      - uses: actions/download-artifact@v4
        if: inputs.voice-engine == 'own'
        with:
          name: voiceover-script-parts  # per-sentence texts from the cloned-voice engine
          path: own/texts
      - name: Narrate scenes and pick clips
        env:
          ELEVENLAB_API: ${{ secrets.ELEVENLAB_API }}
          PEXELS_API: ${{ secrets.PEXELS_API }}
        run: |
          if [ "${{ inputs.voice-engine }}" = own ]; then
            voice_args="--parts own/wavs --texts own/texts"
          else
            voice_args="--voice ${{ inputs.elevenlabs-voice }}"
          fi
          python pipeline/story_build.py story/story.json $voice_args \
            --tempo "${{ inputs.voice-tempo }}" --out story | tee story/build.log
      - name: Render (music bed, banner)
        env:
          BANNER: ${{ inputs.banner }}
        run: |
          title=$(python3 -c "import json;print(json.load(open('story/story.json',encoding='utf-8'))['title'])")
          python pipeline/music.py --style "${{ inputs.music-style }}" --seconds 120 --out music.wav
          # the voice is already in sync with the scenes: no pause tightening, no extra tempo
          python pipeline/render.py --clip story/montage.mp4 --voice story/voice.wav --music music.wav \
            --out final.mp4 --banner "${BANNER:-$title}" --no-tighten --tempo 1.0 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo "Clips:"; sed 's/^/- /' story/credits.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check spoken words (OpenAI transcription)
        env:
          OPEN_AI_API: ${{ secrets.OPEN_AI_API }}
        run: |
          if [ "${{ inputs.voice-engine }}" = own ]; then
            wavs=own/wavs; texts=own/texts
          else
            wavs=story/parts; texts=story/texts
          fi
          python pipeline/check_voice.py --wavs "$wavs" --texts "$texts" \
            --lang "${{ inputs.language }}" --json voice_check.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: story-final
          path: |
            final.mp4
            voice_check.json
            story/story.json
            story/credits.txt
            story/build.log
          retention-days: 7
